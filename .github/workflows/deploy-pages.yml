name: Check and deploy Pages

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Production checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint (including warnings)
        run: npm run lint -- --max-warnings=0
      - name: Tracker and round tests
        run: npm run test:tracking
      - name: Typecheck and production build
        run: npm run build
      - name: Check required assets and Pages limits
        run: npm run check:dist
      - name: Save verified deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Do not interrupt an upload/publish already in progress.
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://aic-motioninbloom.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist/
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Reject superseded commits
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          test "$latest" = "$GITHUB_SHA" || { echo "::error::master has moved; deploy its latest checked commit instead"; exit 1; }
      - name: Publish verified artifact to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.3 pages deploy dist --project-name aic-motioninbloom --branch master --commit-hash "$GITHUB_SHA"
