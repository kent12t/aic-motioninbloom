name: Deploy results dashboard to Cloudflare Pages

on:
  push:
    branches: [offline-results]

permissions:
  contents: read

concurrency:
  group: dashboard-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:dashboard
      - run: npx tsc --noEmit
      - run: npm run build:dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aic-motioninbloom-results.pages.dev
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist
      - name: Create separate dashboard project if needed and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@4.151.3 pages project list --json > projects.json
          if ! node -e 'const projects = require("./projects.json"); process.exit(projects.some(p => p.name === "aic-motioninbloom-results") ? 0 : 1)'; then
            npx --yes wrangler@4.151.3 pages project create aic-motioninbloom-results --production-branch offline-results
          fi
          npx --yes wrangler@4.151.3 pages deploy dashboard-dist --project-name aic-motioninbloom-results --branch offline-results --commit-hash "$GITHUB_SHA"
